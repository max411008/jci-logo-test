<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCI Logo Generator V2.1 Warning Fixed</title>
    <style>
        /* =========================================
           UI THEME: DARK PROFESSIONAL
           ========================================= */
        :root {
            --jci-blue: #0097D7;
            --jci-navy: #1C5775;
            --bg-body: #121212;
            --bg-panel: #1E1E1E;
            --text-main: #E0E0E0;
            --danger: #ff4444; /* 警告紅 */
            --warning-bg: rgba(255, 68, 68, 0.1);
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        h1 { margin: 0 0 10px 0; letter-spacing: 1px; font-weight: 800; }

        .badge {
            background-color: var(--jci-blue);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: monospace;
            margin-bottom: 30px;
        }

        /* 控制面板 */
        .controls {
            background-color: var(--bg-panel);
            border: 1px solid #333;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; position: relative; }
        
        label { font-size: 0.9rem; color: #aaa; font-weight: bold; }

        select, input {
            background-color: #2C2C2C;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        select:focus, input:focus { border-color: var(--jci-blue); }

        /* 警告訊息樣式 */
        .warning-msg {
            color: var(--danger);
            font-size: 0.85rem;
            display: none; /* 預設隱藏 */
            align-items: center;
            gap: 5px;
            background: var(--warning-bg);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--danger);
            margin-top: 5px;
            font-weight: bold;
        }

        button {
            background-color: var(--jci-blue);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background-color: #007bb5; }

        /* 預覽區域 */
        .preview-container { width: 100%; max-width: 800px; position: relative; }
        
        .preview-header {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        #preview-box {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 40px;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            background-color: #222;
            transition: background 0.3s ease;
        }
    </style>
</head>
<body>

    <h1>JCI Logo Generator</h1>
    <span class="badge">V2.1 WARNING SYSTEM ADDED</span>

    <div class="controls">
        <div class="input-group">
            <label>1. 樣式選擇 (Select Mode)</label>
            <select id="modeSelect" onchange="generateLogo()">
                <option value="1">1. White (Transparent BG) - 全白 / 去背</option>
                <option value="2" selected>2. Primary (Transparent BG) - 藍盾 / 藍字 / 去背</option>
                <option value="3">3. Secondary Inverted (Black BG) - 黑底 / 白字</option>
                <option value="4">4. Secondary Black (Transparent BG) - 全黑 / 去背</option>
                <option value="5">5. White on Blue (Blue BG) - 藍底 / 全白</option>
            </select>
        </div>

        <div class="input-group">
            <label>2. 分會名稱 - 第一行 (Chapter Line 1)</label>
            <input type="text" id="chapterInput1" placeholder="ex: JUNIOR CHAMBER" oninput="generateLogo()">
            <div id="warn-length" class="warning-msg">
                ⚠️ 字數過多 (Too Long)! 建議將部分文字移至第二行，以符合 JCI 規範。
            </div>
        </div>

        <div class="input-group">
            <label>3. 分會名稱 - 第二行 (Chapter Line 2, Optional)</label>
            <input type="text" id="chapterInput2" placeholder="ex: INTERNATIONAL TAIPEI (選填)" oninput="generateLogo()">
        </div>

        <button onclick="downloadSVG()">下載 SVG 檔案 (Download SVG)</button>
    </div>

    <div class="preview-container">
        <div class="preview-header">
            <span>Real-time Preview</span>
            <span id="dims-display">Size: Auto</span>
        </div>
        <div id="preview-box">
            </div>
    </div>

    <script>
        // JCI Standard Paths
        const PATH_SHIELD = "M125.6,26.4c-0.6-3.8-1.5-7.5-3.3-10.9c-0.9-1.8-2-3.5-3.2-5.1c-2.3-3-5.3-5.3-8.8-6.8c-3.6-1.5-7.5-1.9-11.4-1.9 H36.2c-3.9,0-7.8,0.5-11.4,1.9c-3.5,1.5-6.5,3.9-8.8,6.8c-1.2,1.6-2.3,3.3-3.2,5.1c-1.7,3.4-2.7,7.1-3.3,10.9 c-0.5,3.7-0.4,7.5,0.4,11.2c0.8,3.6,2.2,7,4.3,10.1c2.1,3,4.8,5.6,8,7.6c6.2,4,13.6,6.1,21,6.1h29.1c7.4,0,14.8-2.1,21-6.1 c3.2-2.1,5.9-4.7,8-7.6c2.1-3,3.5-6.5,4.3-10.1C126,33.9,126.1,30.1,125.6,26.4z M107.4,56.8c-2.5,2.7-5.5,4.8-8.9,6.2 c-3.5,1.5-7.3,2.2-11.1,2.2H57.7c-3.8,0-7.6-0.8-11.1-2.2c-3.3-1.4-6.3-3.5-8.9-6.2c-2.4-2.7-4.4-5.9-5.7-9.3c-1.3-3.5-1.9-7.2-1.7-10.9 c0.2-3.7,1.2-7.3,3-10.6c1.7-3.1,4.1-5.9,7-7.9c5.6-4.1,12.5-6.3,19.5-6.3h25.2c7,0,13.9,2.2,19.5,6.3c2.9,2.1,5.3,4.8,7,7.9 c1.8,3.2,2.8,6.9,3,10.6c0.2,3.7-0.4,7.4-1.7,10.9C111.8,50.9,109.9,54.1,107.4,56.8z";
        const PATH_JCI_TEXT = "M64.7,21.9h7.4v24.5c0,1.9-0.5,3.3-1.4,4.2c-0.9,0.9-2.3,1.4-4.2,1.4s-3.3-0.5-4.2-1.4c-0.9-0.9-1.4-2.3-1.4-4.2h-7.5 c0,3.9,1.1,6.9,3.4,9c2.2,2.1,5.5,3.2,9.7,3.2c4.3,0,7.5-1,9.7-3.1c2.2-2.1,3.4-5.1,3.4-9V21.9h-15V21.9z M86.1,38.6 l6.1-3.6c-1.3-2.6-3.4-3.9-6.3-3.9c-2.4,0-4.3,0.8-5.7,2.3c-1.4,1.5-2.1,3.7-2.1,6.4s0.7,4.8,2.1,6.3c1.4,1.5,3.3,2.3,5.7,2.3 c3.1,0,5.3-1.4,6.6-4.2l5.8,3.9c-2.8,4.7-7,7.1-12.7,7.1c-4.8,0-8.5-1.5-11.2-4.5c-2.7-3-4-7-4-11.9s1.4-8.8,4.2-11.8 c2.8-2.9,6.5-4.4,11.3-4.4C80.8,22.7,84.4,24.3,86.1,38.6z M100.2,21.9h7.5v35.8h-7.5V21.9z";

        const COLORS = {
            blue: "#0097D7",
            navy: "#1C5775",
            white: "#FFFFFF",
            black: "#000000"
        };

        const MODES = {
            "1": { fileName: "JCI_Logo_White", shieldFill: COLORS.white, jciTextFill: "transparent", primaryText: COLORS.white, bgFill: "none", previewBg: "#162235" },
            "2": { fileName: "JCI_Logo_Primary", shieldFill: COLORS.blue, jciTextFill: COLORS.white, primaryText: COLORS.navy, bgFill: "none", previewBg: "#FFFFFF" },
            "3": { fileName: "JCI_Logo_Inverted", shieldFill: COLORS.blue, jciTextFill: COLORS.white, primaryText: COLORS.white, bgFill: COLORS.black, previewBg: "#333" },
            "4": { fileName: "JCI_Logo_Black", shieldFill: COLORS.black, jciTextFill: "transparent", primaryText: COLORS.black, bgFill: "none", previewBg: "#DCDCDC" },
            "5": { fileName: "JCI_Logo_WhiteOnBlue", shieldFill: COLORS.white, jciTextFill: COLORS.blue, primaryText: COLORS.white, bgFill: COLORS.blue, previewBg: "#005f87" }
        };

        window.onload = function() { generateLogo(); };

        function generateLogo() {
            const modeKey = document.getElementById('modeSelect').value;
            const config = MODES[modeKey];
            
            // 取得輸入文字
            let text1 = document.getElementById('chapterInput1').value.toUpperCase();
            let text2 = document.getElementById('chapterInput2').value.toUpperCase();
            
            // 預設值
            if (!text1 && !text2) text1 = "CHAPTER NAME";

            // ==== 警告機制 (Warning Logic) ====
            const warnEl = document.getElementById('warn-length');
            if (text1.length > 15) {
                warnEl.style.display = "flex"; // 顯示警告
            } else {
                warnEl.style.display = "none"; // 隱藏警告
            }

            // ==== 預覽背景處理 ====
            updatePreviewBackground(config);

            // ==== SVG 寬度計算 (Auto-Width) ====
            // 取第一行和第二行較長者來計算
            const maxLen = Math.max(text1.length, text2.length);
            const baseWidth = 600;
            const charWidth = 24; 
            let finalWidth = baseWidth;
            
            // 只有當文字真的很長時才擴展，避免過度留白
            if (maxLen > 15) {
                const estimatedTextWidth = maxLen * charWidth;
                if (estimatedTextWidth > 380) {
                    finalWidth = 220 + estimatedTextWidth;
                }
            }

            // ==== 文字排版邏輯 (Layout Logic) ====
            let textSvgGroup = "";
            const fontStyle = `font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;`;
            
            if (text2) {
                // 雙行模式 (Two Lines)
                // 第一行上移，第二行下移
                textSvgGroup = `
                    <text x="0" y="35" font-size="34" font-weight="400" style="${fontStyle}" fill="${config.primaryText}">Junior Chamber</text>
                    <text x="0" y="72" font-size="34" font-weight="700" style="${fontStyle}" fill="${config.primaryText}">International</text>
                    
                    <text x="0" y="112" font-size="32" font-weight="400" style="${fontStyle}" fill="${config.primaryText}" letter-spacing="1px">${text1}</text>
                    <text x="0" y="148" font-size="32" font-weight="400" style="${fontStyle}" fill="${config.primaryText}" letter-spacing="1px">${text2}</text>
                `;
                // 如果有兩行，高度稍微增加一點比較好看，但標準通常維持高度，這裡維持 200
            } else {
                // 單行模式 (Single Line)
                textSvgGroup = `
                    <text x="0" y="35" font-size="34" font-weight="400" style="${fontStyle}" fill="${config.primaryText}">Junior Chamber</text>
                    <text x="0" y="72" font-size="34" font-weight="700" style="${fontStyle}" fill="${config.primaryText}">International</text>
                    
                    <text x="0" y="115" font-size="36" font-weight="400" style="${fontStyle}" fill="${config.primaryText}" letter-spacing="1px">${text1}</text>
                `;
            }

            // ==== 構建 SVG ====
            let shieldGroup = "";
            if (config.jciTextFill === "transparent") {
                shieldGroup = `
                    <defs>
                        <mask id="jci-mask-cutout">
                            <rect x="0" y="0" width="200" height="150" fill="white"/>
                            <path d="${PATH_JCI_TEXT}" fill="black"/>
                        </mask>
                    </defs>
                    <path d="${PATH_SHIELD}" fill="${config.shieldFill}" mask="url(#jci-mask-cutout)"/>
                `;
            } else {
                shieldGroup = `
                    <path d="${PATH_SHIELD}" fill="${config.shieldFill}"/>
                    <path d="${PATH_JCI_TEXT}" fill="${config.jciTextFill}"/>
                `;
            }

            let bgRect = config.bgFill !== "none" ? `<rect width="100%" height="100%" fill="${config.bgFill}" />` : "";

            const svgString = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${finalWidth} 200" width="${finalWidth}" height="200">
                ${bgRect}
                <g transform="translate(10, 20) scale(1.3)">${shieldGroup}</g>
                <g transform="translate(190, 40)">${textSvgGroup}</g>
            </svg>
            `;

            document.getElementById('preview-box').innerHTML = svgString;
            document.getElementById('dims-display').innerText = `SVG: ${finalWidth}x200`;
        }

        function updatePreviewBackground(config) {
            const box = document.getElementById('preview-box');
            if (config.bgFill !== "none") {
                box.style.background = "#2d2d2d";
                box.style.backgroundImage = "none";
            } else {
                if (config.previewBg === "#FFFFFF") {
                    box.style.background = `linear-gradient(45deg, #eee 25%, transparent 25%), linear-gradient(-45deg, #eee 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #eee 75%), linear-gradient(-45deg, transparent 75%, #eee 75%)`;
                    box.style.backgroundColor = "#fff";
                } else {
                    box.style.background = `linear-gradient(45deg, #2a2a2a 25%, transparent 25%), linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #2a2a2a 75%), linear-gradient(-45deg, transparent 75%, #2a2a2a 75%)`;
                    box.style.backgroundColor = config.previewBg;
                }
                box.style.backgroundSize = "20px 20px";
            }
        }

        function downloadSVG() {
            const svgEl = document.querySelector('#preview-box svg');
            if (!svgEl) return;
            const modeKey = document.getElementById('modeSelect').value;
            const config = MODES[modeKey];
            let name = document.getElementById('chapterInput1').value || "JCI";
            name = name.replace(/[^a-zA-Z0-9]/g, "_").toUpperCase();
            
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svgEl);
            if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            const blob = new Blob([source], {type: "image/svg+xml;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `${config.fileName}_${name}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
